<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Кубики знаний — Предложение</title>
<style>
  :root {
    --game-bg: #fdf6ee;
    --game-bg-gradient: linear-gradient(180deg, #fce4ec 0%, #fdf6ee 40%, #f3e5f5 100%);
    --game-card: #fff8f0;
    --game-card-border: #d4a574;
    --game-primary: #f8bbd0;
    --game-accent: #ce93d8;
    --game-text: #5d4037;
    --game-success: #c5e1a5;
    --game-error: #f48fb1;
    --game-muted: #bcaaa4;
    --game-wood: #c9a882;
    --game-wood-dark: #8d6e63;
    --game-wood-light: #e8d4b8;
    --game-gold: #ffd54f;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  body {
    font-family: 'Comic Sans MS', 'Trebuchet MS', sans-serif;
    background: var(--game-bg-gradient);
    min-height: 100vh;
    color: var(--game-text);
    overflow-x: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      repeating-linear-gradient(90deg,
        transparent,
        transparent 60px,
        rgba(201, 168, 130, 0.08) 60px,
        rgba(201, 168, 130, 0.08) 62px),
      radial-gradient(circle at 15% 20%, rgba(248, 187, 208, 0.25) 0%, transparent 35%),
      radial-gradient(circle at 85% 80%, rgba(206, 147, 216, 0.25) 0%, transparent 35%);
    pointer-events: none;
    z-index: 0;
  }

  .screen {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
    z-index: 1;
  }

  .hidden { display: none !important; }

  .wood-block {
    background:
      linear-gradient(180deg, var(--game-card) 0%, var(--game-wood-light) 100%);
    border: 4px solid var(--game-wood);
    border-radius: 18px;
    box-shadow:
      0 6px 0 var(--game-wood-dark),
      0 10px 20px rgba(93, 64, 55, 0.25),
      inset 0 2px 0 rgba(255, 255, 255, 0.6),
      inset 0 -3px 0 rgba(141, 110, 99, 0.2);
    position: relative;
  }

  .wood-block::before {
    content: '';
    position: absolute;
    inset: 6px;
    border: 2px dashed rgba(141, 110, 99, 0.25);
    border-radius: 12px;
    pointer-events: none;
  }

  #startScreen {
    text-align: center;
  }

  .start-block {
    padding: 35px 25px;
    max-width: 520px;
    width: 100%;
  }

  .title-cubes {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 15px;
    flex-wrap: wrap;
  }

  .mini-cube {
    width: 44px;
    height: 44px;
    background: linear-gradient(180deg, var(--game-primary) 0%, var(--game-accent) 100%);
    border: 3px solid var(--game-wood);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: bold;
    color: var(--game-card);
    box-shadow:
      0 3px 0 var(--game-wood-dark),
      inset 0 1px 0 rgba(255, 255, 255, 0.5);
    animation: cubeFloat 3s ease-in-out infinite;
  }

  .mini-cube:nth-child(2) { animation-delay: 0.3s; background: linear-gradient(180deg, var(--game-accent) 0%, var(--game-primary) 100%); }
  .mini-cube:nth-child(3) { animation-delay: 0.6s; }
  .mini-cube:nth-child(4) { animation-delay: 0.9s; background: linear-gradient(180deg, var(--game-primary) 0%, var(--game-accent) 100%); }

  @keyframes cubeFloat {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50% { transform: translateY(-6px) rotate(3deg); }
  }

  .game-title {
    font-size: 30px;
    color: var(--game-wood-dark);
    margin-bottom: 8px;
    text-shadow: 2px 2px 0 rgba(255, 213, 79, 0.5);
    font-weight: bold;
  }

  .game-subtitle {
    font-size: 17px;
    color: var(--game-text);
    margin-bottom: 25px;
    font-style: italic;
  }

  .cat-helper {
    width: 120px;
    height: 120px;
    margin: 0 auto 15px;
    display: block;
    animation: catBounce 2s ease-in-out infinite;
  }

  @keyframes catBounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }

  .btn {
    background: linear-gradient(180deg, var(--game-primary) 0%, var(--game-accent) 100%);
    color: var(--game-card);
    border: 4px solid var(--game-wood);
    padding: 14px 35px;
    font-size: 19px;
    font-family: inherit;
    font-weight: bold;
    border-radius: 14px;
    cursor: pointer;
    box-shadow:
      0 5px 0 var(--game-wood-dark),
      0 8px 15px rgba(93, 64, 55, 0.25),
      inset 0 2px 0 rgba(255, 255, 255, 0.4);
    transition: all 0.15s;
    text-shadow: 1px 1px 2px rgba(93, 64, 55, 0.4);
  }

  .btn:active {
    transform: translateY(4px);
    box-shadow:
      0 1px 0 var(--game-wood-dark),
      0 2px 5px rgba(93, 64, 55, 0.25);
  }

  .btn-small {
    padding: 10px 22px;
    font-size: 16px;
  }

  .btn-secondary {
    background: linear-gradient(180deg, var(--game-wood-light) 0%, var(--game-wood) 100%);
    color: var(--game-wood-dark);
    text-shadow: none;
  }

  #gameScreen {
    justify-content: flex-start;
    padding-top: 15px;
  }

  .progress-container {
    width: 100%;
    max-width: 600px;
    margin-bottom: 15px;
    padding: 12px 15px;
    background: var(--game-card);
    border: 3px solid var(--game-wood);
    border-radius: 14px;
    box-shadow: 0 4px 0 var(--game-wood-dark), 0 6px 12px rgba(93, 64, 55, 0.2);
  }

  .progress-label {
    font-size: 15px;
    color: var(--game-text);
    margin-bottom: 8px;
    text-align: center;
    font-weight: bold;
  }

  .progress-bar {
    width: 100%;
    height: 18px;
    background: var(--game-wood-light);
    border: 2px solid var(--game-wood);
    border-radius: 10px;
    overflow: hidden;
    position: relative;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--game-success), #aed581);
    transition: width 0.6s ease;
    box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.5);
  }

  .game-area {
    width: 100%;
    max-width: 600px;
    padding: 25px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
  }

  .task-cube {
    width: 100%;
    min-height: 180px;
    padding: 25px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    transition: transform 0.3s;
  }

  .task-cube.rolling {
    animation: rollCube 0.6s ease-out;
  }

  @keyframes rollCube {
    0% { transform: rotateX(0) scale(0.9); }
    50% { transform: rotateX(180deg) scale(1.05); }
    100% { transform: rotateX(360deg) scale(1); }
  }

  .task-number {
    font-size: 14px;
    color: var(--game-accent);
    font-weight: bold;
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .task-text {
    font-size: 20px;
    color: var(--game-text);
    font-weight: bold;
    line-height: 1.4;
    margin-bottom: 15px;
  }

  .task-options {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
    max-width: 400px;
  }

  .option-btn {
    background: linear-gradient(180deg, #fff 0%, var(--game-wood-light) 100%);
    border: 3px solid var(--game-wood);
    border-radius: 12px;
    padding: 12px 18px;
    font-size: 17px;
    font-family: inherit;
    font-weight: bold;
    color: var(--game-text);
    cursor: pointer;
    box-shadow:
      0 4px 0 var(--game-wood-dark),
      inset 0 1px 0 rgba(255, 255, 255, 0.6);
    transition: all 0.15s;
    text-align: left;
  }

  .option-btn:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 var(--game-wood-dark);
  }

  .option-btn.correct {
    background: linear-gradient(180deg, var(--game-success) 0%, #aed581 100%);
    border-color: #7cb342;
  }

  .option-btn.wrong {
    background: linear-gradient(180deg, var(--game-error) 0%, #f06292 100%);
    color: var(--game-card);
    animation: shake 0.5s;
  }

  .option-btn:disabled {
    cursor: default;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }

  .cat-area {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    width: 100%;
    max-width: 500px;
    margin-top: 10px;
  }

  .cat-small {
    width: 70px;
    height: 70px;
    flex-shrink: 0;
  }

  .speech-bubble {
    background: var(--game-card);
    border: 3px solid var(--game-wood);
    border-radius: 15px;
    padding: 12px 15px;
    font-size: 15px;
    color: var(--game-text);
    box-shadow: 0 3px 0 var(--game-wood-dark);
    position: relative;
    flex: 1;
    min-height: 50px;
    display: flex;
    align-items: center;
    animation: fadeIn 0.3s;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-5px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .speech-bubble::before {
    content: '';
    position: absolute;
    left: -12px;
    top: 15px;
    width: 0;
    height: 0;
    border-top: 8px solid transparent;
    border-bottom: 8px solid transparent;
    border-right: 12px solid var(--game-wood);
  }

  .speech-bubble::after {
    content: '';
    position: absolute;
    left: -8px;
    top: 17px;
    width: 0;
    height: 0;
    border-top: 6px solid transparent;
    border-bottom: 6px solid transparent;
    border-right: 9px solid var(--game-card);
  }

  .next-btn-area {
    margin-top: 10px;
  }

  #finalScreen {
    text-align: center;
  }

  .final-block {
    padding: 35px 25px;
    max-width: 520px;
    width: 100%;
  }

  .trophy {
    font-size: 80px;
    margin-bottom: 10px;
    display: block;
    animation: trophyBounce 1s ease;
  }

  @keyframes trophyBounce {
    0% { transform: scale(0) rotate(-180deg); }
    60% { transform: scale(1.2) rotate(10deg); }
    100% { transform: scale(1) rotate(0); }
  }

  .final-title {
    font-size: 28px;
    color: var(--game-wood-dark);
    margin-bottom: 15px;
    text-shadow: 2px 2px 0 rgba(255, 213, 79, 0.5);
  }

  .final-score {
    font-size: 20px;
    color: var(--game-text);
    margin-bottom: 10px;
    font-weight: bold;
  }

  .final-text {
    font-size: 16px;
    color: var(--game-text);
    margin-bottom: 20px;
    line-height: 1.5;
    font-style: italic;
  }

  .final-buttons {
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: center;
  }

  #mistakesArea {
    width: 100%;
    max-width: 520px;
    margin-top: 15px;
    display: none;
  }

  #mistakesArea.show { display: block; }

  .mistake-item {
    background: var(--game-card);
    border: 2px solid var(--game-error);
    border-radius: 12px;
    padding: 12px 15px;
    margin-bottom: 10px;
    text-align: left;
    font-size: 14px;
  }

  .mistake-q { font-weight: bold; color: var(--game-text); margin-bottom: 5px; }
  .mistake-a { color: #7cb342; font-weight: bold; }

  .confetti {
    position: fixed;
    width: 10px;
    height: 10px;
    pointer-events: none;
    z-index: 100;
    animation: confettiFall 1s ease-out forwards;
  }

  @keyframes confettiFall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }

  .corner-cube {
    position: fixed;
    width: 50px;
    height: 50px;
    background: linear-gradient(180deg, var(--game-primary) 0%, var(--game-accent) 100%);
    border: 3px solid var(--game-wood);
    border-radius: 10px;
    z-index: 0;
    opacity: 0.6;
    box-shadow: 0 4px 0 var(--game-wood-dark);
    animation: cubeFloat 4s ease-in-out infinite;
    pointer-events: none;
  }

  .corner-cube.tl { top: 15px; left: 15px; }
  .corner-cube.tr { top: 15px; right: 15px; animation-delay: 1s; background: linear-gradient(180deg, var(--game-accent) 0%, var(--game-primary) 100%); }
  .corner-cube.bl { bottom: 15px; left: 15px; animation-delay: 2s; }
  .corner-cube.br { bottom: 15px; right: 15px; animation-delay: 3s; background: linear-gradient(180deg, var(--game-accent) 0%, var(--game-primary) 100%); }

  @media (max-width: 480px) {
    .game-title { font-size: 24px; }
    .game-subtitle { font-size: 15px; }
    .task-text { font-size: 17px; }
    .option-btn { font-size: 15px; padding: 10px 14px; }
    .speech-bubble { font-size: 14px; padding: 10px 12px; }
    .cat-small { width: 55px; height: 55px; }
    .btn { padding: 12px 28px; font-size: 17px; }
    .corner-cube { width: 35px; height: 35px; }
    .trophy { font-size: 65px; }
    .final-title { font-size: 22px; }
    .final-score { font-size: 17px; }
    .mini-cube { width: 36px; height: 36px; font-size: 18px; }
    .task-cube { min-height: 160px; padding: 20px 15px; }
  }

  @media (max-width: 360px) {
    .game-area { padding: 15px 10px; }
    .start-block, .final-block { padding: 25px 15px; }
    .task-text { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="corner-cube tl"></div>
<div class="corner-cube tr"></div>
<div class="corner-cube bl"></div>
<div class="corner-cube br"></div>

<svg style="display:none">
  <defs>
    <symbol id="cat-svg" viewBox="0 0 120 120">
      <polygon points="25,35 35,15 45,35" fill="#ce93d8" stroke="#5d4037" stroke-width="2"/>
      <polygon points="75,35 85,15 95,35" fill="#ce93d8" stroke="#5d4037" stroke-width="2"/>
      <polygon points="30,30 35,22 40,30" fill="#f8bbd0"/>
      <polygon points="80,30 85,22 90,30" fill="#f8bbd0"/>
      <ellipse cx="60" cy="60" rx="38" ry="35" fill="#f8bbd0" stroke="#5d4037" stroke-width="2.5"/>
      <circle cx="47" cy="55" r="10" fill="#fff" stroke="#5d4037" stroke-width="2"/>
      <circle cx="73" cy="55" r="10" fill="#fff" stroke="#5d4037" stroke-width="2"/>
      <line x1="57" y1="55" x2="63" y2="55" stroke="#5d4037" stroke-width="2"/>
      <circle cx="47" cy="55" r="4" fill="#5d4037"/>
      <circle cx="73" cy="55" r="4" fill="#5d4037"/>
      <circle cx="48" cy="53" r="1.5" fill="#fff"/>
      <circle cx="74" cy="53" r="1.5" fill="#fff"/>
      <polygon points="57,68 63,68 60,72" fill="#f06292"/>
      <path d="M 60 72 Q 55 78 50 75" stroke="#5d4037" stroke-width="1.5" fill="none"/>
      <path d="M 60 72 Q 65 78 70 75" stroke="#5d4037" stroke-width="1.5" fill="none"/>
      <line x1="30" y1="70" x2="45" y2="72" stroke="#5d4037" stroke-width="1"/>
      <line x1="30" y1="75" x2="45" y2="75" stroke="#5d4037" stroke-width="1"/>
      <line x1="75" y1="72" x2="90" y2="70" stroke="#5d4037" stroke-width="1"/>
      <line x1="75" y1="75" x2="90" y2="75" stroke="#5d4037" stroke-width="1"/>
      <polygon points="55,90 60,95 65,90 60,85" fill="#ce93d8" stroke="#5d4037" stroke-width="1.5"/>
    </symbol>
  </defs>
</svg>

<div id="startScreen" class="screen">
  <div class="wood-block start-block">
    <svg class="cat-helper"><use href="#cat-svg"/></svg>
    <div class="title-cubes">
      <div class="mini-cube">К</div>
      <div class="mini-cube">У</div>
      <div class="mini-cube">Б</div>
      <div class="mini-cube">!</div>
    </div>
    <h1 class="game-title">Кубики знаний</h1>
    <p class="game-subtitle">Тема: Предложение. 2 класс</p>
    <p style="font-size:15px; margin-bottom:20px; color:var(--game-text);">
      Нажимай «Выбрать» — и кубик покажет задание!<br>
      Всего 12 заданий. Удачи!
    </p>
    <button class="btn" onclick="startGame()">🎲 Начать игру</button>
  </div>
</div>

<div id="gameScreen" class="screen hidden">
  <div class="progress-container">
    <div class="progress-label" id="progressLabel">Задание 1 из 12</div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <div class="game-area">
    <div class="wood-block task-cube" id="taskCube">
      <div class="task-number" id="taskNumber">Нажми «Выбрать»</div>
      <div class="task-text" id="taskText">Кубик ждёт твоего хода!</div>
      <div class="task-options" id="taskOptions"></div>
    </div>

    <button class="btn" id="rollBtn" onclick="rollTask()">🎲 Выбрать задание</button>
    <button class="btn hidden" id="nextBtn" onclick="nextTask()">Дальше ➡️</button>

    <div class="cat-area">
      <svg class="cat-small"><use href="#cat-svg"/></svg>
      <div class="speech-bubble" id="speechBubble">Мяу! Я кот Профессор. Давай учиться вместе!</div>
    </div>
  </div>
</div>

<div id="finalScreen" class="screen hidden">
  <div class="wood-block final-block">
    <span class="trophy">🏆</span>
    <h1 class="final-title">Миссия выполнена!</h1>
    <div class="final-score" id="finalScore">Баллы: 0 из 12</div>
    <div class="final-text" id="finalText">Ты настоящий знаток русского языка!</div>
    <div class="final-buttons">
      <button class="btn" onclick="restartGame()">🔄 Играть снова</button>
      <button class="btn btn-secondary btn-small" onclick="toggleMistakes()">📋 Посмотреть ошибки</button>
    </div>
    <div id="mistakesArea"></div>
  </div>
</div>

<script>
  const tasks = [
    {
      q: "Что такое предложение?",
      options: ["Группа слов, связанных по смыслу", "Одно любое слово", "Набор букв"],
      correct: 0,
      hint: "Предложение — это слова, которые связаны по смыслу и выражают законченную мысль."
    },
    {
      q: "Какая из записей — предложение?",
      options: ["Зелёный большой.", "Кот спит на коврике.", "Быстро бежать по дороге."],
      correct: 1,
      hint: "«Кот спит на коврике» — это предложение, потому что выражает законченную мысль."
    },
    {
      q: "Сколько слов в предложении «Мама мыла раму»?",
      options: ["2 слова", "3 слова", "4 слова"],
      correct: 1,
      hint: "В предложении «Мама мыла раму» ровно 3 слова."
    },
    {
      q: "С какой буквы начинается первое слово в предложении?",
      options: ["С маленькой", "С большой", "С любой"],
      correct: 1,
      hint: "Первое слово в предложении всегда пишется с большой буквы."
    },
    {
      q: "Какой знак ставится в конце вопросительного предложения?",
      options: [".", "?", "!"],
      correct: 1,
      hint: "В конце вопросительного предложения ставится вопросительный знак ?"
    },
    {
      q: "Расставь слова в порядке: «в, гуляют, парке, дети»",
      options: ["Дети гуляют в парке.", "В парке дети гуляют.", "Гуляют дети в парке."],
      correct: 0,
      hint: "Правильный порядок: «Дети гуляют в парке.»"
    },
    {
      q: "Какая запись НЕ является предложением?",
      options: ["Птица поёт.", "Красивый цветок.", "Дети играют."],
      correct: 1,
      hint: "«Красивый цветок.» — это не предложение, а просто слова без связи. В предложении есть действие и законченная мысль."
    },
    {
      q: "Выбери правильное окончание: «У кошки родились...»",
      options: ["быстро.", "маленькие котята.", "и."],
      correct: 1,
      hint: "«У кошки родились маленькие котята.» — предложение имеет смысл."
    },
    {
      q: "Какой знак нужно поставить в конце: «Как тебя зовут___»",
      options: [".", "?", "!"],
      correct: 1,
      hint: "Это вопросительное предложение, поэтому в конце ставится вопросительный знак ?"
    },
    {
      q: "Какое предложение восклицательное?",
      options: ["Кто там?", "Какой красивый закат!", "Солнце светит."],
      correct: 1,
      hint: "«Какой красивый закат!» — восклицательное, в конце стоит !"
    },
    {
      q: "Какое слово нужно добавить: «Дети читают ___ книгу»?",
      options: ["быстро", "интересную", "и"],
      correct: 1,
      hint: "«Дети читают интересную книгу» — получается связное предложение."
    },
    {
      q: "Что обязательно есть в предложении?",
      options: ["Только имена", "Связь слов по смыслу", "Много длинных слов"],
      correct: 1,
      hint: "В предложении слова обязательно связаны по смыслу."
    }
  ];

  const catPhrases = {
    start: [
      "Мяу! Я кот Профессор. Готов к приключениям?",
      "Мур-р! Давай учиться вместе!",
      "Привет, друг! Я помогу тебе.",
      "Мяу! Нажимай «Выбрать» — и вперёд!"
    ],
    correct: [
      "Мур-р! Отлично! Ты молодец!",
      "Мяу! Верно! Так держать!",
      "Браво! Ты настоящий знаток!",
      "Ура! Правильный ответ!"
    ],
    wrong: [
      "Мяу... Почти! Попробуй ещё разок.",
      "Не расстраивайся! Подумай ещё.",
      "Ой, не совсем... Ты справишься!",
      "Мур-р, давай ещё разок!"
    ],
    final: [
      "Мяу! Ты прошёл все задания!",
      "Ура! Миссия выполнена!",
      "Мур-р! Ты настоящий герой!",
      "Браво! Я горжусь тобой!"
    ]
  };

  let availableTasks = [];
  let currentTask = null;
  let currentTaskIndex = -1;
  let score = 0;
  let answered = 0;
  let mistakes = [];
  let waitingNext = false;

  function randomFrom(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function startGame() {
    document.getElementById('startScreen').classList.add('hidden');
    document.getElementById('gameScreen').classList.remove('hidden');
    document.getElementById('finalScreen').classList.add('hidden');

    availableTasks = tasks.map((_, i) => i);
    score = 0;
    answered = 0;
    mistakes = [];
    waitingNext = false;
    currentTask = null;

    document.getElementById('taskNumber').textContent = 'Нажми «Выбрать»';
    document.getElementById('taskText').textContent = 'Кубик ждёт твоего хода!';
    document.getElementById('taskOptions').innerHTML = '';
    document.getElementById('rollBtn').classList.remove('hidden');
    document.getElementById('nextBtn').classList.add('hidden');

    setCatPhrase('start');
    updateProgress();
  }

  function rollTask() {
    if (availableTasks.length === 0) return;

    const idx = Math.floor(Math.random() * availableTasks.length);
    currentTaskIndex = availableTasks.splice(idx, 1)[0];
    currentTask = tasks[currentTaskIndex];

    const cube = document.getElementById('taskCube');
    cube.classList.remove('rolling');
    void cube.offsetWidth;
    cube.classList.add('rolling');

    document.getElementById('taskNumber').textContent = `Задание ${answered + 1} из ${tasks.length}`;
    document.getElementById('taskText').textContent = currentTask.q;

    const optionsDiv = document.getElementById('taskOptions');
    optionsDiv.innerHTML = '';
    currentTask.options.forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.textContent = opt;
      btn.onclick = () => selectOption(i, btn);
      optionsDiv.appendChild(btn);
    });

    document.getElementById('rollBtn').classList.add('hidden');
    document.getElementById('nextBtn').classList.add('hidden');
    waitingNext = false;
  }

  function selectOption(idx, btn) {
    if (waitingNext) return;
    const allBtns = document.querySelectorAll('.option-btn');
    allBtns.forEach(b => b.disabled = true);

    if (idx === currentTask.correct) {
      btn.classList.add('correct');
      score++;
      answered++;
      setCatPhrase('correct');
      showConfetti();
      showFeedback(true, currentTask.hint);
    } else {
      btn.classList.add('wrong');
      allBtns[currentTask.correct].classList.add('correct');
      mistakes.push({
        q: currentTask.q,
        userAnswer: currentTask.options[idx],
        correctAnswer: currentTask.options[currentTask.correct]
      });
      answered++;
      setCatPhrase('wrong');
      showFeedback(false, `Правильный ответ: ${currentTask.options[currentTask.correct]}. ${currentTask.hint}`);
    }

    updateProgress();
    waitingNext = true;

    if (answered === tasks.length) {
      setTimeout(showFinal, 1800);
    } else {
      document.getElementById('nextBtn').classList.remove('hidden');
    }
  }

  function showFeedback(success, text) {
    const bubble = document.getElementById('speechBubble');
    const prefix = success ? '✨ ' : '💭 ';
    bubble.textContent = prefix + text;
    bubble.style.animation = 'none';
    void bubble.offsetWidth;
    bubble.style.animation = 'fadeIn 0.3s';
  }

  function setCatPhrase(type) {
    const phrase = randomFrom(catPhrases[type]);
    document.getElementById('speechBubble').textContent = phrase;
  }

  function nextTask() {
    document.getElementById('taskNumber').textContent = 'Нажми «Выбрать»';
    document.getElementById('taskText').textContent = 'Следующий кубик уже ждёт!';
    document.getElementById('taskOptions').innerHTML = '';
    document.getElementById('rollBtn').classList.remove('hidden');
    document.getElementById('nextBtn').classList.add('hidden');
    waitingNext = false;
    setCatPhrase('start');
  }

  function updateProgress() {
    const percent = (answered / tasks.length) * 100;
    document.getElementById('progressFill').style.width = percent + '%';
    document.getElementById('progressLabel').textContent = `Задание ${Math.min(answered + 1, tasks.length)} из ${tasks.length}`;
  }

  function showConfetti() {
    const colors = ['#f8bbd0', '#ce93d8', '#c5e1a5', '#ffd54f', '#fff8f0'];
    for (let i = 0; i < 30; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.top = '-20px';
      c.style.background = colors[Math.floor(Math.random() * colors.length)];
      c.style.animationDelay = Math.random() * 0.3 + 's';
      c.style.animationDuration = (0.8 + Math.random() * 0.5) + 's';
      c.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 1500);
    }
  }

  function showFinal() {
    document.getElementById('gameScreen').classList.add('hidden');
    document.getElementById('finalScreen').classList.remove('hidden');

    document.getElementById('finalScore').textContent = `Баллы: ${score} из ${tasks.length}`;

    let text = '';
    if (score === tasks.length) text = 'Идеально! Все задания выполнены верно!';
    else if (score >= tasks.length * 0.7) text = 'Отличный результат! Ты хорошо знаешь тему!';
    else if (score >= tasks.length * 0.4) text = 'Хорошо! Но есть над чем поработать. Ты справишься!';
    else text = 'Не переживай! Попробуй ещё раз — и всё получится!';

    document.getElementById('finalText').textContent = text;
    setCatPhrase('final');
    showConfetti();
    setTimeout(showConfetti, 400);
  }

  function toggleMistakes() {
    const area = document.getElementById('mistakesArea');
    if (area.classList.contains('show')) {
      area.classList.remove('show');
      return;
    }
    if (mistakes.length === 0) {
      area.innerHTML = '<div class="mistake-item"><div class="mistake-q">🎉 Ошибок нет! Ты молодец!</div></div>';
    } else {
      area.innerHTML = '<h3 style="margin-bottom:10px; color:var(--game-wood-dark);">Разбор ошибок:</h3>' +
        mistakes.map(m => `
          <div class="mistake-item">
            <div class="mistake-q">❓ ${m.q}</div>
            <div>Твой ответ: ${m.userAnswer}</div>
            <div class="mistake-a">✅ Правильно: ${m.correctAnswer}</div>
          </div>
        `).join('');
    }
    area.classList.add('show');
  }

  function restartGame() {
    document.getElementById('mistakesArea').classList.remove('show');
    document.getElementById('mistakesArea').innerHTML = '';
    document.getElementById('finalScreen').classList.add('hidden');
    document.getElementById('startScreen').classList.remove('hidden');
  }
</script>

</body>
</html>
